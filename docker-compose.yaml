services:
  rsud:
    build:
      context: .
      dockerfile: Dockerfile
    image: rsud-arrozy-app:local
    container_name: cp_rsudarrozy

    restart: unless-stopped

    working_dir: /var/www/html

    # Port host dan container mengikuti APP_PORT di .env (default 8000).
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"

    # MySQL dijalankan secara eksternal (host atau container terpisah).
    # Gunakan DB_HOST=host.docker.internal di .env agar container bisa terhubung ke MySQL host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ".:/var/www/html"
      # Pertahankan vendor dari image agar tidak tertimpa bind mount.
      - "/var/www/html/vendor"

    command: php artisan serve --host=0.0.0.0
