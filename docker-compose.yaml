services:
  rsud:
    build:
      context: .
      dockerfile: Dockerfile
    image: rsud-arrozy-app:local
    container_name: cp_rsudarrozy

    restart: unless-stopped

    working_dir: /var/www/html

    # Host networking: container memakai network host, sehingga DB_HOST=127.0.0.1
    # bisa digunakan meskipun MySQL berjalan di host atau di container lain
    # yang mem-publish port 3306 ke host. Port aplikasi (APP_PORT) langsung
    # dipakai di host; tidak perlu port mapping.
    network_mode: host

    volumes:
      - ".:/var/www/html"
      # Pertahankan vendor dari image agar tidak tertimpa bind mount.
      - "/var/www/html/vendor"

    command: php artisan serve --host=0.0.0.0 --port=${APP_PORT:-8000}
